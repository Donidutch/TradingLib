name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked --extra test
      - name: Test
        # Live vendor tests stay skipped: they need TRADINGLIB_NETWORK_TESTS=1.
        run: uv run pytest -q

  web:
    # The React console (SPEC D1b), built from web/ and served at /app.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Builds the image and starts it, so a broken Dockerfile or a server that
    # cannot boot in a container fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tradinglib:ci .
      - name: Start container
        run: docker run -d --name tradinglib -p 127.0.0.1:8200:8200 tradinglib:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8200/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8200/api/health | grep -q '"ok":true'
          curl -sf -o /dev/null http://127.0.0.1:8200/          # vanilla-JS console
          curl -sf -o /dev/null http://127.0.0.1:8200/app/      # React console
          test "$(docker exec tradinglib id -u)" != "0"         # not running as root
      - name: Container logs
        if: always()
        run: docker logs tradinglib
