name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked --extra test
      - name: Test
        # Live vendor tests stay skipped: they need TRADINGLIB_NETWORK_TESTS=1.
        run: uv run pytest -q
